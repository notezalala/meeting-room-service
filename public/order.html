<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<title>Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="/socket.io/socket.io.js"></script>

</head>

<body class="dashboard-body">

<div class="dashboard-header">

    ☕ Housekeeping Dashboard

</div>

<div class="dashboard-container"
    id="orders">

</div>

<script>

const socket = io();

loadOldOrders();

socket.on('new_request', (data)=>{

    addCard(data);

});

async function loadOldOrders(){

    try{

        const response =
            await fetch('/requests');

        const orders =
            await response.json();

        orders.forEach(order => {

            addCard({

                id: order.id,

                room: order.room_name,

                coffee: order.coffee,

                water: order.water,

                tea: order.tea,

                serve_time: order.serve_time,

                comment: order.comment,

                status: order.status

            });

        });

    }catch(err){

        console.log(err);

    }

}

function addCard(data){

    if(document.getElementById(`card-${data.id}`))
        return;

    let statusClass = 'pending';

    let statusText = 'รอดำเนินการ';

    if(data.status === 'PREPARING'){

        statusClass = 'preparing';

        statusText = 'กำลังเตรียม';

    }

    if(data.status === 'DONE'){

        statusClass = 'done';

        statusText = 'เสร็จสิ้น';

    }

    const div = document.createElement('div');

    div.className = "card";

    div.id = `card-${data.id}`;

    div.innerHTML = `

        <div>

            <div class="room">

                ${data.room}

            </div>

            <div class="info">

                ☕ Coffee : ${data.coffee}<br>

                💧 Water : ${data.water}<br>

                🍵 Tea : ${data.tea}

                <br><br>

                🕒 เวลาเสิร์ฟ :
                ${data.serve_time}

                <br><br>

                📝 หมายเหตุ :
                ${data.comment || '-'}

            </div>

            <div class="status ${statusClass}"
                id="status-${data.id}">

                ${statusText}

            </div>

        </div>

        <div class="actions">

            <button class="btn-preparing"
                onclick="setPreparing(${data.id})">

                กำลังเตรียม

            </button>

            <button class="btn-done"
                onclick="setDone(${data.id})">

                เสร็จสิ้น

            </button>

        </div>

    `;

    document.getElementById('orders')
        .prepend(div);

}

function setPreparing(id){

    const status =
        document.getElementById(`status-${id}`);

    status.innerHTML =
        "กำลังเตรียม";

    status.className =
        "status preparing";

}

function setDone(id){

    const status =
        document.getElementById(`status-${id}`);

    status.innerHTML =
        "เสร็จสิ้น";

    status.className =
        "status done";

}

</script>

</body>

</html>
