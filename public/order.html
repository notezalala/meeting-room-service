<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<title>Order</title>

<link rel="stylesheet" href="style.css">

<!-- IMPORTANT: socket.io -->
<script src="/socket.io/socket.io.js"></script>

<style>
body{
    font-family: sans-serif;
    padding: 20px;
}

.box{
    max-width: 500px;
    margin: auto;
}

input, button{
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}

.time-btns button{
    width: 48%;
}
</style>
</head>

<body>

<div class="box">

    <h2>☕ Order System</h2>

    <input id="room" placeholder="Room">
    <input id="coffee" type="number" placeholder="Coffee">
    <input id="water" type="number" placeholder="Water">
    <input id="tea" type="number" placeholder="Tea">

    <input id="serve_time" placeholder="Serve Time">

    <div class="time-btns">
        <button onclick="setTime(15)">+15 นาที</button>
        <button onclick="setTime(30)">+30 นาที</button>
    </div>

    <input id="comment" placeholder="Comment">

    <button onclick="sendOrder()">ส่งออเดอร์</button>

</div>

<script>

let socket;

// =====================
// SAFE INIT SOCKET
// =====================
window.onload = () => {
    try {
        socket = io();

        socket.on("connect", () => {
            console.log("Socket Connected");
        });

    } catch (err) {
        console.log("Socket error:", err);
    }

    setRoomFromURL();
};

// =====================
// GET ROOM FROM URL
// =====================
function setRoomFromURL(){
    const params = new URLSearchParams(window.location.search);
    const room = params.get("room");

    if(room){
        document.getElementById("room").value = room;
    }
}

// =====================
// TIME +15 +30
// =====================
function getTimePlus(min){

    const now = new Date();
    now.setMinutes(now.getMinutes() + min);

    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');

    return `${hh}:${mm}`;
}

function setTime(min){
    document.getElementById("serve_time").value = getTimePlus(min);
}

// =====================
// SEND ORDER (SAFE)
// =====================
function sendOrder(){

    try{

        const data = {
            room: document.getElementById('room').value || '',
            coffee: document.getElementById('coffee').value || 0,
            water: document.getElementById('water').value || 0,
            tea: document.getElementById('tea').value || 0,
            serve_time: document.getElementById('serve_time').value || '',
            comment: document.getElementById('comment').value || ''
        };

        fetch('/request', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(() => {

            alert("ส่งออเดอร์แล้ว");

            document.getElementById('coffee').value = "";
            document.getElementById('water').value = "";
            document.getElementById('tea').value = "";
            document.getElementById('serve_time').value = "";
            document.getElementById('comment').value = "";

        });

    }catch(err){
        console.log("send error:", err);
    }
}

</script>

</body>
</html>
