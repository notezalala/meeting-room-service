<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Order</title>
<link rel="stylesheet" href="style.css">
<script src="/socket.io/socket.io.js"></script>
</head>

<body>

<div class="container">

<h2>☕ Order</h2>

<input id="room" placeholder="Room">
<input id="coffee" type="number" placeholder="Coffee">
<input id="water" type="number" placeholder="Water">
<input id="tea" type="number" placeholder="Tea">

<input id="serve_time" placeholder="Serve Time">

<button onclick="setTime(15)">+15 นาที</button>
<button onclick="setTime(30)">+30 นาที</button>

<textarea id="comment" placeholder="Comment"></textarea>

<button onclick="sendOrder()">ส่งออเดอร์</button>

</div>

<script>

const socket = io();

function getTime(min){

    const now = new Date();
    now.setMinutes(now.getMinutes() + min);

    return now.getHours().toString().padStart(2,'0')
    + ':' +
    now.getMinutes().toString().padStart(2,'0');
}

function setTime(min){
    document.getElementById('serve_time').value = getTime(min);
}

async function sendOrder(){

    const data = {
        room: document.getElementById('room').value,
        coffee: document.getElementById('coffee').value,
        water: document.getElementById('water').value,
        tea: document.getElementById('tea').value,
        serve_time: document.getElementById('serve_time').value,
        comment: document.getElementById('comment').value
    };

    await fetch('/request', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(data)
    });

    alert("ส่งแล้ว");

}

</script>

</body>
</html>
