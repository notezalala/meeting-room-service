<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="/socket.io/socket.io.js"></script>
</head>

<body class="dashboard-body">

<div class="dashboard-header">
☕ Housekeeping Dashboard
</div>

<div class="dashboard-container" id="orders"></div>

<script>

const socket = io();

let list = [];

// ================= LOAD =================
socket.emit('get_all_requests');

socket.on('all_requests', (data) => {

    list = data.sort((a,b)=>b.id-a.id);
    render();

});

// ================= NEW =================
socket.on('new_request', (data) => {

    list.unshift(data);
    render();

});

// ================= STATUS UPDATE (IMPORTANT FIX) =================
socket.on('status_updated', ({ id, status }) => {

    const el = document.getElementById(`status-${id}`);
    if (!el) return;

    el.className = `status ${status}`;

    if (status === 'preparing') el.innerHTML = 'กำลังเตรียม';
    if (status === 'done') el.innerHTML = 'เสร็จสิ้น';

});

// ================= RENDER =================
function render(){

    const c = document.getElementById('orders');
    c.innerHTML = "";

    list.forEach((item, i) => {
        c.appendChild(card(item, i+1));
    });

}

// ================= CARD =================
function card(d, no){

    const div = document.createElement('div');
    div.className = "card";

    div.innerHTML = `
        <div>

            <div class="room">
                #${no} - ${d.room_name || 'UNKNOWN'}
            </div>

            <div class="info">
                ☕ Coffee : ${d.coffee || 0}<br>
                💧 Water : ${d.water || 0}<br>
                🍵 Tea : ${d.tea || 0}<br><br>

                🕒 ${d.serve_time || '-'}<br><br>

                📝 ${d.comment || '-'}
            </div>

            <div class="status ${d.status}" id="status-${d.id}">
                ${text(d.status)}
            </div>

        </div>

        <div class="actions">

            <button onclick="prep(${d.id})" class="btn-preparing">
                กำลังเตรียม
            </button>

            <button onclick="done(${d.id})" class="btn-done">
                เสร็จสิ้น
            </button>

        </div>
    `;

    return div;
}

// ================= STATUS TEXT =================
function text(s){

    if(s === 'PENDING') return 'รอดำเนินการ';
    if(s === 'preparing') return 'กำลังเตรียม';
    if(s === 'done') return 'เสร็จสิ้น';

    return s;
}

// ================= BUTTONS (FIX HERE) =================
function prep(id){
    socket.emit('update_status', { id, status: 'preparing' });
}

function done(id){
    socket.emit('update_status', { id, status: 'done' });
}

</script>

</body>
</html>
