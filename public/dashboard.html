<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="/socket.io/socket.io.js"></script>
</head>

<body class="dashboard-body">

<div class="dashboard-header">
☕ Housekeeping Dashboard
</div>

<div class="dashboard-container" id="orders"></div>

<script>

const socket = io();

// =====================
// LOAD DATA
// =====================
socket.emit('get_all_requests');

socket.on('all_requests', (list) => {

    const container = document.getElementById('orders');
    container.innerHTML = "";

    // 🔥 IMPORTANT FIX: FORCE NEWEST FIRST
    list
        .sort((a, b) => b.id - a.id)
        .forEach(addCard);

});

// =====================
// REALTIME
// =====================
socket.on('new_request', (data) => {

    if(document.getElementById(`card-${data.id}`)) return;

    addCard(data);

});

// =====================
// CARD
// =====================
function addCard(data){

    if(!data.room) data.room = "UNKNOWN";

    const div = document.createElement('div');
    div.className = "card";
    div.id = `card-${data.id}`;

    div.innerHTML = `
        <div>

            <div class="room">${data.room}</div>

            <div class="info">
                ☕ Coffee : ${data.coffee}<br>
                💧 Water : ${data.water}<br>
                🍵 Tea : ${data.tea}<br><br>
                🕒 เวลาเสิร์ฟ : ${data.serve_time}<br><br>
                📝 หมายเหตุ : ${data.comment || '-'}
            </div>

            <div class="status pending" id="status-${data.id}">
                ${getStatus(data.status)}
            </div>

        </div>

        <div class="actions">

            <button class="btn-preparing" onclick="setPreparing(${data.id})">
                กำลังเตรียม
            </button>

            <button class="btn-done" onclick="setDone(${data.id})">
                เสร็จสิ้น
            </button>

        </div>
    `;

    document.getElementById('orders').prepend(div);
}

// =====================
// STATUS
// =====================
function getStatus(status){

    if(status === 'preparing') return 'กำลังเตรียม';
    if(status === 'done') return 'เสร็จสิ้น';

    return 'รอดำเนินการ';
}

// =====================
// UPDATE STATUS
// =====================
function setPreparing(id){

    socket.emit('update_status', {
        id,
        status: 'preparing'
    });

    updateUI(id,'preparing','กำลังเตรียม');
}

function setDone(id){

    socket.emit('update_status', {
        id,
        status: 'done'
    });

    updateUI(id,'done','เสร็จสิ้น');
}

function updateUI(id,cls,text){

    const el = document.getElementById(`status-${id}`);

    if(el){
        el.className = `status ${cls}`;
        el.innerHTML = text;
    }
}

</script>

</body>
</html>
